name: Linux
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["archlinux:base", "ubuntu:24.04", "debian:13"]
    container: ${{ matrix.image }}
    steps:
      - name: Install distribution packages
        shell: sh
        run: |
          if command -v pacman >/dev/null; then
            pacman -Syu --noconfirm --needed git gcc make python-pyqt6 python-pillow ca-certificates
          else
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git gcc libc6-dev make python3-pyqt6 python3-pil ca-certificates
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: ./tests/smoke.sh
      - run: ./scripts/install-linux.sh
      - name: Render the installed desktop widget
        run: QT_QPA_PLATFORM=offscreen /usr/bin/python3 tests/linux_ui.py
