name: Linux
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: Arch, image: "archlinux:base" }
          - { distro: Debian, image: "debian:13" }
          - { distro: Ubuntu }
    name: ${{ matrix.distro }}
    container: ${{ matrix.image }}
    steps:
      - name: Install distribution packages
        shell: sh
        run: |
          if command -v pacman >/dev/null; then
            pacman -Syu --noconfirm --needed git gcc make python-pyqt6 python-pillow ca-certificates
          else
            root=""
            if [ "$(id -u)" != 0 ]; then root=sudo; fi
            $root apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
            $root env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git gcc libc6-dev make python3-pyqt6 python3-pil ca-certificates
          fi
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: ./tests/smoke.sh
      - run: ./scripts/install-linux.sh
      - name: Render the installed desktop widget
        run: QT_QPA_PLATFORM=offscreen /usr/bin/python3 tests/linux_ui.py
